openapi: 3.1.0
info:
  title: api-go · Factorización QR
  version: 1.0.0
  description: |
    Servicio autónomo (Go + Fiber v3) que recibe una matriz rectangular, calcula su
    **factorización QR completa mediante rotaciones de Givens** y envía Q y R a
    **api-node**, que devuelve estadísticas sobre ellas.

    **Autenticación:** obtén un token en `POST /api/v1/auth/login` y envíalo como
    `Authorization: Bearer <token>`. api-go reenvía ese mismo token a api-node.

    **Errores:** todas las respuestas de error usan el esquema `ErrorResponse`.
servers:
  - url: http://localhost:8080
    description: Local / Docker
tags:
  - name: Auth
  - name: Matrix
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Estado del servicio
      security: []
      responses:
        "200":
          description: El servicio está activo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Obtener un token de acceso (JWT)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { username: admin, password: admin123 }
      responses:
        "200":
          description: Credenciales válidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Credenciales inválidas (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/matrix/qr:
    post:
      tags: [Matrix]
      summary: Factorización QR de una matriz y estadísticas de Q y R
      description: |
        Calcula A = Q·R, donde Q (m×m) es ortogonal y R (m×n) es triangular superior
        con diagonal no negativa. Luego solicita a api-node las estadísticas de Q y R.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QRRequest" }
            example:
              matrix: [[12, -51, 4], [6, 167, -68], [-4, 24, -41]]
      responses:
        "200":
          description: Factorización y estadísticas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QRResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: api-node no está disponible o respondió con error (`STATISTICS_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "504":
          description: api-node no respondió a tiempo (`STATISTICS_TIMEOUT`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Cuerpo inválido (`INVALID_REQUEST`) o matriz inválida (`INVALID_MATRIX`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { error: { code: INVALID_MATRIX, message: "la matriz debe ser rectangular: la fila 1 tiene 1 columnas y se esperaban 2" } }
    Unauthorized:
      description: Token ausente, inválido o expirado (`UNAUTHORIZED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Matrix:
      type: array
      description: Matriz en orden de filas. Todas las filas deben tener el mismo largo.
      minItems: 1
      items:
        type: array
        minItems: 1
        items: { type: number }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Segundos hasta la expiración }

    QRRequest:
      type: object
      required: [matrix]
      properties:
        matrix:
          $ref: "#/components/schemas/Matrix"
          description: Matriz rectangular de hasta MATRIX_MAX_DIMENSION filas y columnas (100 por defecto).

    QRResponse:
      type: object
      required: [q, r, statistics]
      properties:
        q: { $ref: "#/components/schemas/Matrix", description: "Matriz ortogonal Q (m×m)" }
        r: { $ref: "#/components/schemas/Matrix", description: "Matriz triangular superior R (m×n)" }
        statistics: { $ref: "#/components/schemas/Statistics" }

    Statistics:
      type: object
      description: Estadísticas calculadas por api-node sobre Q y R.
      required: [max, min, average, sum, count, anyDiagonal, matrices]
      properties:
        max: { type: number }
        min: { type: number }
        average: { type: number }
        sum: { type: number }
        count: { type: integer, description: Cantidad total de valores considerados }
        anyDiagonal: { type: boolean, description: true si alguna matriz es diagonal }
        matrices:
          type: array
          items:
            type: object
            required: [name, isDiagonal]
            properties:
              name: { type: string, examples: [Q, R] }
              isDiagonal: { type: boolean }

    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, INVALID_MATRIX, INVALID_CREDENTIALS, UNAUTHORIZED, NOT_FOUND,
                     METHOD_NOT_ALLOWED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE,
                     STATISTICS_UNAVAILABLE, STATISTICS_TIMEOUT, INTERNAL_ERROR, HTTP_ERROR]
            message: { type: string }
